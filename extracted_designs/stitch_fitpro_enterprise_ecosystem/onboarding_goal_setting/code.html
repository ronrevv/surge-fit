<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.goal-card');
    const continueBtn = document.getElementById('continue-btn');
    let selectedValue = null;

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Deselect all
        cards.forEach(c => c.setAttribute('data-selected', 'false'));
        
        // Select clicked
        card.setAttribute('data-selected', 'true');
        selectedValue = card.getAttribute('data-value');
        
        // Enable button
        continueBtn.removeAttribute('disabled');
        
        // Subtle haptic feedback simulation (visual bump)
        card.style.transform = 'scale(0.98)';
        setTimeout(() => {
            card.style.transform = 'scale(1)';
        }, 100);
      });
    });

    continueBtn.addEventListener('click', () => {
        if(!selectedValue) return;
        // Proceed to next step simulation
        continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
        setTimeout(() => {
             console.log("Proceeding with goal:", selectedValue);
        }, 800);
    });
  });
